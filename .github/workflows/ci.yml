name: CI
on: [push, pull_request]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No secrets in the repo
        run: |
          if git ls-files | grep -E '(^|/)\.env$|kaggle\.json$'; then echo "secret file tracked"; exit 1; fi
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' -- . ':!*.lock' ':!apps/web/package-lock.json'; then echo "secret-like string"; exit 1; fi
      - name: Nothing under gigsim/ changed (instructor-provided simulator)
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || true)
          if [ -n "$base" ] && git diff --name-only "$base" HEAD | grep -E '^gigsim/'; then echo "gigsim/ must not be modified"; exit 1; fi
      - name: Every prompt lives in agent/prompts/ (no inline prompts)
        run: |
          if git grep -nE '(You are the |You are an? (AI|assistant))' -- 'agent/*.py' 'agent/nodes/*.py' 'agent/graphs/*.py' 'rag/*.py' 'apps/*'; then echo "inline prompt found"; exit 1; fi
      - name: Every number in README / report traces to evals/results
        run: python scripts/check_readme_numbers.py
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Build the deterministic synthetic fallback dataset (real Kaggle data is not redistributed)
        run: cd scripts && python preprocess_jobs.py --synthetic-fallback && python build_price_stats.py && python gen_personas.py && python build_dev_set.py
      - run: ruff check .
      - name: Unit, contract and integration tests
        run: pytest -q
        env: { MODEL_PROFILE: offline }
  playwright:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -e ".[dev]"
      - name: Build the deterministic synthetic fallback dataset
        run: cd scripts && python preprocess_jobs.py --synthetic-fallback && python build_price_stats.py && python gen_personas.py && python build_dev_set.py
      - run: cd apps/web && npm ci && npm run build && npx playwright install --with-deps chromium
      - run: cd apps/web && npx playwright test
        env: { CI: "true", PYTHON: python }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report }
