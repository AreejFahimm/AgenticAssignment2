name: Smoke eval
on: [pull_request]
jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Build the deterministic synthetic fallback dataset (real Kaggle data is not redistributed)
        run: cd scripts && python preprocess_jobs.py --synthetic-fallback && python build_price_stats.py && python gen_personas.py && python build_dev_set.py
      - name: 30-job smoke eval (fails if bid/skip F1 drops or unsupported claims / injection success rise past evals/thresholds.yaml)
        run: python -m evals.runners.smoke_eval
        env: { MODEL_PROFILE: offline }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-results, path: evals/results/smoke.json }
